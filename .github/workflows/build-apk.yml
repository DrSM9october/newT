name: Build Android APK (LinguaAI)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install NPM Dependencies
        run: npm ci || npm install

      - name: Build Web Frontend
        run: npm run build

      - name: Setup Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Capacitor Android Platform
        run: |
          if [ ! -d "android" ]; then
            npx @capacitor/cli add android || npx cap add android || true
          fi
          npx @capacitor/cli sync android || npx cap sync android

      - name: Grant Execute Permission for Gradle Wrapper
        run: |
          if [ -f "android/gradlew" ]; then
            chmod +x android/gradlew
          fi

      - name: Build Debug & Release APKs
        run: |
          if [ -d "android" ]; then
            cd android
            ./gradlew assembleDebug assembleRelease --no-daemon --stacktrace
          fi

      - name: Generate Keystore & Sign Release APK
        run: |
          if [ -f "android/app/build/outputs/apk/release/app-release-unsigned.apk" ]; then
            echo "Generating LinguaAI Keystore..."
            keytool -genkey -v -keystore linguaai-release.keystore \
              -alias linguaai \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass linguaaipass \
              -keypass linguaaipass \
              -dname "CN=LinguaAI, OU=Mobile, O=LinguaAI App, L=Tehran, C=IR"

            echo "Signing Release APK..."
            jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 \
              -keystore linguaai-release.keystore \
              -storepass linguaaipass \
              -keypass linguaaipass \
              android/app/build/outputs/apk/release/app-release-unsigned.apk linguaai

            cp android/app/build/outputs/apk/release/app-release-unsigned.apk android/app/build/outputs/apk/release/LinguaAI-v1.0.0-Signed.apk
          fi

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LinguaAI-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload Signed Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LinguaAI-v1.0.0-Signed-Release-APK
          path: android/app/build/outputs/apk/release/LinguaAI-v1.0.0-Signed.apk
          if-no-files-found: ignore
          retention-days: 30
